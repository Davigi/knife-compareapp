[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# ── Shopify storefront proxy ──────────────────────────────────────────────────
# Routed through a Netlify Function so we can set proper headers.
# The dumb [[redirects]] approach caused Shopify to reject requests.
[[redirects]]
  from  = "/api/*"
  to    = "/.netlify/functions/shopify-proxy"
  status = 200
  force  = true
